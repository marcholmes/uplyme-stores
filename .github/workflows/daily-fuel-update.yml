name: Update Daily Fuel Prices

on:
  schedule:
    # Runs at 06:00 UTC (07:00 BST in summer)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update HTML prices
        run: node scripts/update-prices.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fuel-tracker.html
          git diff-index --quiet HEAD || (git commit -m "chore: automated daily fuel price refresh" && git push)
